<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link4M-BYPASS Logo 16:9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Khung hình chuẩn 16:9 nền trắng tuyệt đối */
    .canvas-16-9 {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4%;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.2vw, 38px);
      user-select: none;
    }

    /* Biểu tượng L4M SVG */
    .logo-icon {
      height: clamp(72px, 11vw, 180px);
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    /* Khối chữ bên phải */
    .logo-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1;
    }

    .brand-title {
      font-size: clamp(38px, 6.2vw, 102px);
      font-weight: 800;
      color: #050505;
      letter-spacing: -0.03em;
      line-height: 1.02;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: clamp(4px, 0.7vw, 12px);
      font-size: clamp(16px, 2.35vw, 38px);
      font-weight: 600;
      color: #555960;
      letter-spacing: 0.08em;
      line-height: 1.1;
      padding-left: 2px;
    }
  </style>
</head>
<body>
  <div class="canvas-16-9">
    <div class="logo-wrapper">
      <!-- Icon L4M Vector -->
      <svg class="logo-icon" viewBox="0 0 210 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradient cho chữ L (Xanh dương -> Cyan) -->
          <linearGradient id="gradL" x1="10" y1="10" x2="65" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="55%" stop-color="#0EA5E9" />
            <stop offset="100%" stop-color="#2563EB" />
          </linearGradient>

          <!-- Gradient cho số 4 (Cyan -> Xanh ngọc lục bảo) -->
          <linearGradient id="grad4" x1="35" y1="75" x2="115" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0EA5E9" />
            <stop offset="45%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>

          <!-- Gradient cho chữ M (Xanh mint -> Xanh lá đậm) -->
          <linearGradient id="gradM" x1="100" y1="10" x2="195" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="50%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#047857" />
          </linearGradient>

          <!-- Bóng gấp nhẹ tạo khối 3D cho chữ M -->
          <linearGradient id="gradMShade" x1="120" y1="10" x2="165" y2="95" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#059669" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#047857" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- Chữ L -->
        <path d="M12 12 H34 V98 H78 V120 H12 V12 Z" fill="url(#gradL)" />

        <!-- Số 4 -->
        <path d="M98 12 L42 74 L42 92 H122 V72 H72 L98 42 V12 Z" fill="url(#grad4)" />
        <rect x="94" y="64" width="22" height="56" fill="url(#grad4)" />

        <!-- Chữ M -->
        <path d="M94 12 H118 L152 68 L186 12 H208 V120 H186 V50 L152 104 L118 50 V120 H94 V12 Z" fill="url(#gradM)" />
        <!-- Mảng chuyển khối giữa chữ M -->
        <path d="M118 12 L152 68 L152 104 L118 50 Z" fill="url(#gradMShade)" />
      </svg>

      <!-- Phần chữ -->
      <div class="logo-text">
        <div class="brand-title">Link4M-BYPASS</div>
        <!-- Bạn có thể thêm tên vào sau chữ "by" tại dòng dưới nếu muốn -->
        <div class="brand-subtitle">development by @NGDuy210</div>
      </div>
    </div>
  </div>
</body>
</html>
